<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folk Music Revival Project</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Your Custom Styles -->
    <link rel="stylesheet" href="../css/style.css">
    
    <!-- Custom CSS for compact layout -->
    <style>
        .resource-card {
            transition: all 0.3s ease;
            height: 100%;
            text-decoration: none;
            color: inherit;
            display: block;
            border: 1px solid rgba(0,0,0,0.125);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 0.5rem;
            background-color: white;
        }
        .resource-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border-color: #0d6efd;
            background-color: #f8f9fa;
        }
        .resource-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
            color: #2c3e50;
        }
        .resource-subtitle {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 0.3rem;
        }
        .page-header {
            margin-bottom: 1.5rem;
        }
        .compact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }
        @media (max-width: 768px) {
            .compact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <div id="navbar-container"></div>

    <main class="container py-4">
        <div class="page-header text-center mb-4">
            <h1 class="h3 fw-bold">Class Activities</h1>
            <p class="lead">Primary resource in subheader</p>
        </div>

        <div class="compact-grid">
            <!-- Card 1: Woody Guthrie -->
            <a href="#" class="resource-card">
                <div class="resource-title">Jigsaw</div>
                <div class="resource-subtitle">...</div>
            </a>

            <!-- Card 2: Odetta -->
            <a href="#" class="resource-card">
                <div class="resource-title">Photo Gallery Walk</div>
                <div class="resource-subtitle">Photo Gallery</div>
            </a>

            <!-- Card 3: Broadside Magazine -->
            <a href="#" class="resource-card">
                <div class="resource-title">I See, I Hear</div>
                <div class="resource-subtitle">...</div>
            </a>

            <!-- Card 4: Folk Music Bios -->
            <a href="#" class="resource-card">
                <div class="resource-title">Lyric Analysis</div>
                <div class="resource-subtitle">Talking Blues</div>
            </a>

            <!-- Card 5: Talkin' Blues -->
            <a href="#" class="resource-card">
                <div class="resource-title">Silent Conversation</div>
                <div class="resource-subtitle">...</div>
            </a>

            <!-- Card 6: We Shall Overcome -->
            <a href="#" class="resource-card">
                <div class="resource-title">Dinner Party</div>
                <div class="resource-subtitle">...</div>
            </a>

            <!-- Card 7: This Land Is Your Land -->
            <a href="#" class="resource-card">
                <div class="resource-title">Broad-zines</div>
                <div class="resource-subtitle">Broadside</div>
            </a>

            <!-- Card 8: Pictures -->
            <a href="#" class="resource-card">
                <div class="resource-title">8</div>
                <div class="resource-subtitle">...</div>
            </a>

            <!-- Card 9: Hollywood Roundtable -->
            <a href="#" class="resource-card">
                <div class="resource-title">9</div>
                <div class="resource-subtitle">...</div>
            </a>

            <!-- Card 10: Playlist -->
            <a href="#" class="resource-card">
                <div class="resource-title">Hootenanny</div>
                <div class="resource-subtitle">Playlist</div>
            </a>
        </div>
    </main>

    <footer class="mt-5 py-3 text-center text-muted border-top">
        <p class="mb-0">Academic Research Project | Folk Music Revival Studies</p>
    </footer>
    
    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Your Custom JS -->
    <script src="../js/script.js"></script>
    <script src="../js/include.js"></script>
</body>
</html>
